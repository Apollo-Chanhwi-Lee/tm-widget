<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TM — Token Monitor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Monaco', 'Menlo', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .logo { font-size: 56px; font-weight: bold; color: #f0c040; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #888; margin-bottom: 6px; }
    .services { display: flex; gap: 12px; margin-bottom: 40px; }
    .badge {
      padding: 4px 12px; border-radius: 20px;
      font-size: 11px; font-weight: bold;
    }
    .claude  { background: #2a2200; color: #f0c040; border: 1px solid #f0c040; }
    .chatgpt { background: #001a0f; color: #10a37f; border: 1px solid #10a37f; }
    .gemini  { background: #001033; color: #4285f4; border: 1px solid #4285f4; }

    .version { font-size: 12px; color: #555; margin-bottom: 32px; }

    .os-detected {
      font-size: 12px; color: #f0c040;
      margin-bottom: 20px;
      padding: 6px 16px;
      border: 1px solid #2a2200;
      border-radius: 20px;
      background: #1a1400;
    }

    .download-btns { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 340px; }
    .btn {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; border-radius: 10px;
      text-decoration: none; font-size: 13px; font-weight: bold;
      border: 1px solid #333; cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn.primary {
      background: #f0c040; color: #0d0d0d;
      border-color: #f0c040;
    }
    .btn.primary:hover { background: #ffd060; }
    .btn.secondary {
      background: #1a1a1a; color: #ccc;
      border-color: #333;
    }
    .btn.secondary:hover { background: #222; border-color: #444; }

    .btn .icon { font-size: 18px; }
    .btn .text { flex: 1; text-align: left; margin-left: 12px; }
    .btn .size { font-size: 10px; color: #888; }

    .footer {
      margin-top: 50px;
      text-align: center;
      font-size: 11px;
      color: #444;
    }
    .footer a { color: #f0c040; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    .loading { font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <div class="logo">TM</div>
  <div class="subtitle">Token Monitor — AI 사용량 위젯</div>
  <div class="services">
    <span class="badge claude">Claude</span>
    <span class="badge chatgpt">ChatGPT</span>
    <span class="badge gemini">Gemini</span>
  </div>

  <div class="version" id="version">최신 버전 확인 중...</div>
  <div class="os-detected" id="os-detected">OS 감지 중...</div>

  <div class="download-btns" id="download-btns">
    <div class="loading">다운로드 링크 가져오는 중...</div>
  </div>

  <div class="footer">
    <a href="https://github.com/Apollo-Chanhwi-Lee/tm-widget" target="_blank">GitHub 저장소</a>
    ·
    <a href="https://github.com/Apollo-Chanhwi-Lee/tm-widget/releases" target="_blank">모든 릴리즈</a>
    ·
    MIT License
  </div>

  <script>
    const REPO = 'Apollo-Chanhwi-Lee/tm-widget'
    const API_URL = `https://api.github.com/repos/${REPO}/releases/latest`

    // OS 감지
    function detectOS() {
      const ua = navigator.userAgent.toLowerCase()
      if (ua.includes('mac')) return 'macOS'
      if (ua.includes('win')) return 'Windows'
      if (ua.includes('linux')) return 'Linux'
      return 'Unknown'
    }

    // 파일 크기 포맷
    function formatSize(bytes) {
      if (!bytes) return ''
      const mb = bytes / (1024 * 1024)
      return `${mb.toFixed(1)} MB`
    }

    // 최신 릴리즈 가져오기
    async function loadLatestRelease() {
      try {
        const res = await fetch(API_URL)
        if (!res.ok) {
          throw new Error('릴리즈 정보를 가져올 수 없습니다')
        }
        const data = await res.json()

        // 버전 표시
        document.getElementById('version').textContent = `최신 버전: ${data.tag_name || 'v1.0.0'}`

        // OS 감지 표시
        const os = detectOS()
        document.getElementById('os-detected').textContent = `감지된 OS: ${os}`

        // 다운로드 버튼 생성
        const buttons = []
        const assets = data.assets || []

        // macOS .dmg 찾기
        const dmg = assets.find(a => a.name.endsWith('.dmg'))
        if (dmg) {
          buttons.push({
            icon: '🍎',
            text: 'macOS 다운로드',
            size: formatSize(dmg.size),
            url: dmg.browser_download_url,
            primary: os === 'macOS'
          })
        }

        // Windows .exe 찾기
        const exe = assets.find(a => a.name.endsWith('.exe'))
        if (exe) {
          buttons.push({
            icon: '🪟',
            text: 'Windows 다운로드',
            size: formatSize(exe.size),
            url: exe.browser_download_url,
            primary: os === 'Windows'
          })
        }

        // 버튼 렌더링
        const container = document.getElementById('download-btns')
        if (buttons.length === 0) {
          container.innerHTML = '<div class="loading">아직 빌드된 릴리즈가 없습니다</div>'
        } else {
          container.innerHTML = buttons
            .sort((a, b) => b.primary - a.primary) // primary 먼저
            .map(btn => `
              <a href="${btn.url}" class="btn ${btn.primary ? 'primary' : 'secondary'}">
                <span class="icon">${btn.icon}</span>
                <span class="text">${btn.text}</span>
                <span class="size">${btn.size}</span>
              </a>
            `).join('')
        }
      } catch (err) {
        console.error('릴리즈 로드 실패:', err)
        document.getElementById('version').textContent = '버전: v1.0.0'
        document.getElementById('download-btns').innerHTML = `
          <div class="loading" style="color: #ff4444;">
            릴리즈 정보를 가져올 수 없습니다.<br>
            <a href="https://github.com/${REPO}/releases" style="color: #f0c040;">GitHub Releases 페이지</a>에서 직접 다운로드하세요.
          </div>
        `
      }
    }

    loadLatestRelease()
  </script>
</body>
</html>
